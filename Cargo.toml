[package]
name = "vchat64"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/*"]

[workspace.dependencies]
audio_common.path = "crates/audio_common"
audio_stream.path = "crates/audio_stream"
chrono = { version = "0.4.45", features = ["serde"] }
color-eyre = "0.6.5"
crossbeam = "0.8.5"
dirs = "7.0.0"
fearless_simd = "1.1.0"
fs-err = "3.3.2"
hex = "0.4.3"
itertools = "0.15.0"
num = "0.4.3"
opus = "0.4.0"
postcard = "1.1.3"
rayon = "1.12.0"
ringbuf = "0.5.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = { version = "0.1.44", features = ["release_max_level_warn"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dependencies]
chrono.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
color-eyre.workspace = true
config = "0.15.27"
crossterm = "0.29.0"
friend_code.path = "crates/friend_code"
ratatui = "0.30.2"
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml = "1.1.8+spec-1.1.0"
tracing.workspace = true
tracing-subscriber.workspace = true
vchat.path = "crates/vchat"

[profile.dev.package."*"]
opt-level = 3
debug = true

[profile.release]
debug = "line-tables-only"
lto = "fat"
codegen-units = 1
