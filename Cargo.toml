[package]
name = "vchat64"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
  "crates/friend_code",
  "crates/net_lib",
  "crates/opus_dasp_bridge",
  "crates/vchat"
]

[workspace.dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
color-eyre = "0.6.5"
crossbeam = "0.8.4"
dirs = "6.0.0"
hex = "0.4.3"
postcard = "1.1.3"
rayon = "1.12.0"
ringbuf = "0.5.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"

[dependencies]
chrono.workspace = true
clap = { version = "4.6.1", features = ["derive"] }
color-eyre.workspace = true
config = "0.15.23"
crossterm = "0.29.0"
friend_code.path = "crates/friend_code"
ratatui = "0.30.0"
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml = "0.9.8"
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
vchat.path = "crates/vchat"

[profile.dev.package."*"]
opt-level = 3
debug = true
