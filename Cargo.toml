[package]
name = "vchat64"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/friend_code", "crates/net_lib", "crates/opus_cpal_bridge", "crates/vchat"]

[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
color-eyre = "0.6.5"
crossbeam = "0.8.5"
dirs = "7.0.0"
hex = "0.4.3"
postcard = "1.1.3"
rayon = "1.12.0"
ringbuf = "0.5.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"

[dependencies]
chrono.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
color-eyre.workspace = true
config = "0.15.26"
crossterm = "0.29.0"
friend_code.path = "crates/friend_code"
ratatui = "0.30.2"
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml = "1.1.6+spec-1.1.0"
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
vchat.path = "crates/vchat"

[profile.dev.package."*"]
opt-level = 3
debug = true
